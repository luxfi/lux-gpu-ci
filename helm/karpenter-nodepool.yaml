###############################################################################
# Karpenter v1 NodePool + EC2NodeClass for GPU spot instances.
#
# Behavior:
#   - 0 GPU nodes idle. When a pod with `nvidia.com/gpu` request and matching
#     toleration is unschedulable, Karpenter provisions a g4dn.xlarge spot.
#   - Falls back to g5.xlarge if g4dn unavailable.
#   - 30s after the pod terminates, Karpenter consolidates the node away.
#   - amazon-linux-2023 AMI ships GPU drivers via NVIDIA device plugin DS.
###############################################################################
---
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: gpu
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: ${KARPENTER_NODE_IAM_ROLE_NAME}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: ${CLUSTER_NAME}
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        iops: 3000
        throughput: 125
        deleteOnTermination: true
        encrypted: true
  metadataOptions:
    httpEndpoint: enabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    Project: lux-gpu-ci
    Component: gpu-runner
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: gpu-spot
spec:
  template:
    metadata:
      labels:
        workload: gpu-ci
        nvidia.com/gpu.present: "true"
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: gpu
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["g4dn.xlarge", "g5.xlarge"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
      taints:
        - key: nvidia.com/gpu
          value: "present"
          effect: NoSchedule
      expireAfter: 24h
      terminationGracePeriod: 5m
  limits:
    cpu: "8"
    memory: 32Gi
    "nvidia.com/gpu": 1
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 30s
  weight: 10
